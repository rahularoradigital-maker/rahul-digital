name: CI

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Claude
        run: npm run check:claude

      - name: Check crypto
        run: npm run check:crypto

      - name: Check rules engine
        run: npm run check:rules

      - name: Check validator
        run: npm run check:validator

      - name: Check backtest harness
        run: npm run check:backtest

      - name: Check cache seam
        run: npm run check:cache

      - name: Check rule library + decision engine
        run: npm run check:decision

      - name: Check fatigue v2 + forecasts
        run: npm run check:fatigue2

      - name: Check fingerprint + diversity
        run: npm run check:diversity

      - name: Check account + production intelligence
        run: npm run check:account

      - name: Check confidence + data quality
        run: npm run check:quality

      - name: Check trust gates + spend floor
        run: npm run check:gates

      - name: Check causality ladder
        run: npm run check:causality

      - name: Check change-log attribution
        run: npm run check:changelog

      - name: Check same-objective comparator
        run: npm run check:comparator

      - name: Check verdict engine
        run: npm run check:verdict
