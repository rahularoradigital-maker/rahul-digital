name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (avoids the old push+PR double-run and stale in-flight runs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Persist Next/Turbopack's incremental build cache across runs (cold builds are slow).
      - name: Cache .next/cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        run: npm run build

      # One step runs ALL 33 correctness gates, so a new check script can never silently miss CI.
      - name: Run all checks
        run: npm run check:all
