name: CI

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Claude
        run: npm run check:claude

      - name: Check crypto
        run: npm run check:crypto

      - name: Check rules engine
        run: npm run check:rules

      - name: Check validator
        run: npm run check:validator

      - name: Check backtest harness
        run: npm run check:backtest

      - name: Check cache seam
        run: npm run check:cache
