name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (avoids the old push+PR double-run and stale in-flight runs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Persist Next/Turbopack's incremental build cache across runs (cold builds are slow).
      - name: Cache .next/cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ hashFiles('**/package-lock.json') }}-

      # ISSUE 11: lint is part of the declared GREEN gate. It runs before build so a genuine lint
      # error (bad syntax, a real react-hooks violation, an unescaped entity) fails CI on its own,
      # not just the type errors caught by the build's tsc pass.
      - name: Lint
        run: npm run lint

      # Standalone type gate: fails fast on any type error, independent of next build's config.
      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # One step runs ALL correctness gates in PARALLEL (scripts/run-checks.mjs runs the exact check:all set,
      # ~50x faster wall-clock, and reports EVERY failure instead of stopping at the first). `check:all` (the
      # serial chain) is kept as the source of the job list and a fallback.
      - name: Run all checks
        run: npm run check
