<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creative Analytics Run Inspector</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2330;
    --border: #2d3646;
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --amber: #d29922;
    --chip: #21304a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #131a24, #0d1117);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  nav button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  nav button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #04121f;
  }
  main { padding: 24px 28px 80px; max-width: 1500px; margin: 0 auto; }
  section.tab { display: none; }
  section.tab.active { display: block; }
  h2 { font-size: 16px; margin: 22px 0 10px; }
  h2:first-child { margin-top: 0; }
  .hint { color: var(--muted); font-size: 12px; margin-bottom: 12px; }

  /* loader */
  #loader {
    max-width: 720px;
    margin: 60px auto;
    text-align: center;
  }
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 48px 24px;
    background: var(--panel);
    cursor: pointer;
  }
  #dropzone.dragover { border-color: var(--accent); background: var(--panel2); }
  #dropzone p { color: var(--muted); margin-top: 8px; }
  #dropzone strong { color: var(--text); font-size: 16px; }
  #loadError { color: var(--red); margin-top: 14px; }
  #app { display: none; }

  /* summary cards */
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    min-width: 150px;
  }
  .card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .card .v { font-size: 18px; font-weight: 600; margin-top: 2px; }

  .digest {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 14px 18px;
    white-space: pre-wrap;
    color: #c6d2de;
    font-size: 13px;
  }
  .warn {
    background: rgba(210, 153, 34, 0.08);
    border: 1px solid rgba(210, 153, 34, 0.4);
    color: var(--amber);
    border-radius: 8px;
    padding: 8px 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }

  /* tables */
  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 900px; background: var(--panel); }
  th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th {
    background: var(--panel2);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
  }
  th .arrow { color: var(--accent); }
  tr:hover td { background: #1a2230; }
  td.good { color: var(--green); font-weight: 600; }
  td.bad { color: var(--red); font-weight: 600; }
  .mono { font-family: Consolas, monospace; font-size: 12.5px; }
  .adlink { color: var(--accent); cursor: pointer; text-decoration: none; }
  .adlink:hover { text-decoration: underline; }
  .subrow td { background: #11161f !important; color: var(--muted); font-size: 12.5px; }
  .expander { cursor: pointer; color: var(--accent); font-weight: 600; }

  input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 12px;
    width: 280px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }

  /* chips */
  .chip {
    display: inline-block;
    background: var(--chip);
    border: 1px solid #2c4a76;
    color: #9ec3f0;
    border-radius: 999px;
    padding: 1px 10px;
    font-size: 12px;
    margin: 2px 3px 2px 0;
    font-family: Consolas, monospace;
  }
  .chip.k { background: #20262e; border-color: var(--border); color: var(--muted); }

  /* candidate cards */
  .candidates { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 16px; }
  .cand {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
  }
  .cand.scale { border-left: 4px solid var(--green); }
  .cand.pause { border-left: 4px solid var(--red); }
  .cand .media { width: 170px; flex-shrink: 0; background: #000; position: relative; }
  .cand .media img, .cand .media video { width: 100%; height: 100%; object-fit: cover; display: block; min-height: 220px; }
  .cand .body { padding: 14px 16px; flex: 1; min-width: 0; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    border-radius: 6px;
    padding: 2px 8px;
    letter-spacing: 0.05em;
  }
  .badge.scale { background: rgba(63, 185, 80, 0.15); color: var(--green); }
  .badge.pause { background: rgba(248, 81, 73, 0.15); color: var(--red); }
  .cand .adid { font-family: Consolas, monospace; font-size: 12.5px; color: var(--muted); margin: 6px 0; }
  .metricgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 14px; margin: 10px 0; }
  .metricgrid .m .k { color: var(--muted); font-size: 11px; }
  .metricgrid .m .v { font-weight: 600; font-size: 14px; }
  .reason { font-size: 12.5px; color: #c6d2de; margin-top: 6px; }
  .playbtn {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.25);
    cursor: pointer; border: none; width: 100%;
  }
  .playbtn span {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(13, 17, 23, 0.85);
    border: 2px solid #fff;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    padding-left: 4px;
  }

  /* dataset cards */
  .dsgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(640px, 1fr)); gap: 18px; }
  .ds {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    overflow: hidden;
    scroll-margin-top: 140px;
  }
  .ds.flash { box-shadow: 0 0 0 2px var(--accent); }
  .ds .media { width: 230px; flex-shrink: 0; background: #000; position: relative; }
  .ds .media img, .ds .media video { width: 100%; height: 100%; min-height: 300px; object-fit: cover; display: block; }
  .ds .body { padding: 14px 18px; flex: 1; min-width: 0; }
  .ds .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ds .adid { font-family: Consolas, monospace; font-size: 13px; font-weight: 600; }
  .tag {
    font-size: 11px; border-radius: 6px; padding: 2px 8px; font-weight: 600;
    background: #20304a; color: #9ec3f0;
  }
  .tag.scale { background: rgba(63,185,80,0.15); color: var(--green); }
  .tag.pause { background: rgba(248,81,73,0.15); color: var(--red); }
  .crystals { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 12px; margin: 10px 0; }
  .crystals .c .k { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .crystals .c .v { font-family: Consolas, monospace; font-size: 12.5px; word-break: break-word; }
  details.tr summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
  details.tr p {
    background: #11161f; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; margin-top: 6px; font-size: 12.5px; color: #c6d2de;
  }
  .perfline { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .perfline .m .k { color: var(--muted); font-size: 10.5px; text-transform: uppercase; }
  .perfline .m .v { font-weight: 600; font-size: 13.5px; }
  .extlink { color: var(--accent); font-size: 12px; }

  /* cross patterns */
  .xgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .xcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .xcard .score { font-size: 22px; font-weight: 700; }
  .xcard .score.good { color: var(--green); }
  .xcard .score.bad { color: var(--red); }
  .xcard .cnt { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 12px; }
  .inr-badge {
    display: inline-block;
    background: rgba(88, 166, 255, 0.12);
    border: 1px solid rgba(88, 166, 255, 0.35);
    color: #9ec3f0;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-left: 8px;
    vertical-align: middle;
  }
  .inr { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .currency-note {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>Creative Analytics Run Inspector <span class="inr-badge">INR &#8377;</span></h1>
  <div class="sub" id="runMeta">Load the workflow response JSON to begin &middot; all spend, CPC, CPA, and conversion value shown in Indian Rupees</div>
  <nav id="tabs" style="display:none">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="candidates">Scale / Pause Ads</button>
    <button data-tab="performance">Performance Table</button>
    <button data-tab="ranked">Ranked Groups</button>
    <button data-tab="groups">Crystal Groups</button>
    <button data-tab="cross">Cross-Crystal Patterns</button>
    <button data-tab="dataset">Analysis Dataset (Crystal QA)</button>
  </nav>
</header>

<main>
  <div id="loader">
    <div id="dropzone">
      <strong>Drop the response JSON here or click to browse</strong>
      <p>Expected file: response_1781074104776.json (a creative_analytics workflow run response)</p>
      <input type="file" id="fileInput" accept=".json,application/json" style="display:none" />
    </div>
    <div id="loadError"></div>
  </div>

  <div id="app">
    <section class="tab active" id="tab-overview"></section>
    <section class="tab" id="tab-candidates"></section>
    <section class="tab" id="tab-performance"></section>
    <section class="tab" id="tab-ranked"></section>
    <section class="tab" id="tab-groups"></section>
    <section class="tab" id="tab-cross"></section>
    <section class="tab" id="tab-dataset"></section>
  </div>
</main>

<script>
"use strict";

var DATA = null;
var OUT = null;
var adIndex = {};
var scaleIds = {};
var pauseIds = {};

/* ---------- formatting helpers (INR) ---------- */
var INR_MONEY = new Intl.NumberFormat("en-IN", {
  style: "currency",
  currency: "INR",
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});
var INR_COST = new Intl.NumberFormat("en-IN", {
  style: "currency",
  currency: "INR",
  minimumFractionDigits: 2,
  maximumFractionDigits: 4
});
var INR_NUMBER = new Intl.NumberFormat("en-IN", {
  minimumFractionDigits: 0,
  maximumFractionDigits: 2
});

function isNum(v) { return typeof v === "number" && isFinite(v); }
function metricValue() {
  for (var i = 0; i < arguments.length; i++) {
    var raw = arguments[i];
    if (raw === null || raw === undefined || raw === "") continue;
    var num = typeof raw === "number" ? raw : Number(raw);
    if (isFinite(num)) return num;
  }
  return null;
}
function dataMetricValue() {
  var value = metricValue.apply(null, arguments);
  return value === null ? "" : value;
}
function fmt(v, dec) {
  if (!isNum(v)) return "\u2014";
  if (dec === undefined) dec = 2;
  return INR_NUMBER.format(v);
}
function fmtInt(v) { return isNum(v) ? v.toLocaleString("en-IN") : "\u2014"; }
function fmtPct(v) { return isNum(v) ? fmt(v, 2) + "%" : "\u2014"; }
function fmtMoney(v) {
  if (!isNum(v)) return "\u2014";
  return "<span class=\"inr\">" + INR_MONEY.format(v) + "</span>";
}
function fmtCost(v) {
  if (!isNum(v)) return "\u2014";
  return "<span class=\"inr\">" + INR_COST.format(v) + "</span>";
}
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ---------- loading ---------- */
var dropzone = document.getElementById("dropzone");
var fileInput = document.getElementById("fileInput");
var loadError = document.getElementById("loadError");

dropzone.addEventListener("click", function () { fileInput.click(); });
fileInput.addEventListener("change", function () {
  if (fileInput.files.length) readFile(fileInput.files[0]);
});
dropzone.addEventListener("dragover", function (e) { e.preventDefault(); dropzone.classList.add("dragover"); });
dropzone.addEventListener("dragleave", function () { dropzone.classList.remove("dragover"); });
dropzone.addEventListener("drop", function (e) {
  e.preventDefault();
  dropzone.classList.remove("dragover");
  if (e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]);
});

function readFile(file) {
  var reader = new FileReader();
  reader.onload = function () {
    try { boot(JSON.parse(reader.result)); }
    catch (err) { loadError.textContent = "Could not parse JSON: " + err.message; }
  };
  reader.readAsText(file);
}

/* Auto-load when served over http(s) or when fetch on file:// is permitted */
fetch("response_1781074104776.json")
  .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function (json) { if (!DATA) boot(json); })
  .catch(function () { /* fall back to manual file selection */ });

/* ---------- boot ---------- */
function boot(json) {
  DATA = json;
  OUT = json.output || json;
  adIndex = {};
  (OUT.analysis_dataset || []).forEach(function (e) { adIndex[e.ad_id] = e; });
  (OUT.ads_to_scale || []).forEach(function (a) { scaleIds[a.ad_id] = true; });
  (OUT.ads_to_pause || []).forEach(function (a) { pauseIds[a.ad_id] = true; });

  document.getElementById("loader").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("tabs").style.display = "flex";
  document.getElementById("runMeta").innerHTML =
    "Run <span class=\"mono\">" + esc(DATA.id || OUT.run_id || "") + "</span>" +
    " &middot; status <strong>" + esc(DATA.status || OUT.status || "") + "</strong>" +
    " &middot; window " + esc(OUT.reporting_window || "") +
    (OUT.date_range ? " (" + esc(OUT.date_range.since) + " \u2192 " + esc(OUT.date_range.until) + ")" : "");

  renderOverview();
  renderCandidates();
  renderPerformance();
  renderRanked();
  renderGroups();
  renderCross();
  renderDataset();
}

/* ---------- tabs ---------- */
document.getElementById("tabs").addEventListener("click", function (e) {
  var btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  activateTab(btn.dataset.tab);
});
function activateTab(name) {
  document.querySelectorAll("#tabs button").forEach(function (b) {
    b.classList.toggle("active", b.dataset.tab === name);
  });
  document.querySelectorAll("section.tab").forEach(function (s) {
    s.classList.toggle("active", s.id === "tab-" + name);
  });
}

/* ---------- media helpers ---------- */
function mediaUrlCandidates(ad) {
  var seen = {};
  var urls = [];
  function push(u) {
    u = String(u || "").trim();
    if (!u || seen[u]) return;
    seen[u] = true;
    urls.push(u);
  }
  /* Prefer full creative image/video URLs; Meta thumbnail_url is often a generic 64x64 placeholder. */
  push(ad.image_url);
  push(ad.media_url);
  push(ad.thumbnail_url);
  return urls;
}

function mediaBlock(adId) {
  var entry = adIndex[adId];
  var ad = entry ? entry.ad || {} : {};
  var urls = mediaUrlCandidates(ad);
  var video = ad.video_source_url || "";
  var html = "<div class=\"media\" data-video=\"" + esc(video) + "\">";
  if (urls.length) {
    html += "<img src=\"" + esc(urls[0]) + "\" loading=\"lazy\" alt=\"ad media\" " +
      "data-fallbacks=\"" + esc(urls.slice(1).join("|")) + "\" " +
      "onerror=\"var f=this.dataset.fallbacks?this.dataset.fallbacks.split('|').filter(Boolean):[];" +
      "if(f.length){this.src=f.shift();this.dataset.fallbacks=f.join('|');}else{this.style.display='none';}\" />";
  } else {
    html += "<div style=\"padding:12px;color:#8b98a9;font-size:12px;min-height:220px;display:flex;align-items:center;justify-content:center\">No preview URL</div>";
  }
  if (video) {
    html += "<button class=\"playbtn\" title=\"Play video\"><span>\u25B6</span></button>";
  }
  html += "</div>";
  return html;
}
document.addEventListener("click", function (e) {
  var btn = e.target.closest(".playbtn");
  if (!btn) return;
  var media = btn.parentElement;
  var url = media.dataset.video;
  if (!url) return;
  media.innerHTML =
    "<video controls autoplay src=\"" + esc(url) + "\"" +
    " onerror=\"this.outerHTML='<div style=&quot;padding:12px;color:#8b98a9;font-size:12px&quot;>Video blocked by CDN. <a class=&quot;extlink&quot; target=&quot;_blank&quot; href=&quot;" + esc(url) + "&quot;>Open in new tab</a></div>'\"></video>";
});

function adLink(adId) {
  return "<a class=\"adlink mono\" href=\"#\" data-jump=\"" + esc(adId) + "\">" + esc(adId) + "</a>";
}
document.addEventListener("click", function (e) {
  var a = e.target.closest("[data-jump]");
  if (!a) return;
  e.preventDefault();
  activateTab("dataset");
  var card = document.getElementById("ad-" + a.dataset.jump);
  if (card) {
    card.scrollIntoView({ behavior: "smooth", block: "start" });
    card.classList.add("flash");
    setTimeout(function () { card.classList.remove("flash"); }, 2000);
  }
});

/* ---------- sortable tables ---------- */
function makeSortable(table) {
  var ths = table.querySelectorAll("th[data-sort]");
  ths.forEach(function (th) {
    th.addEventListener("click", function () {
      var idx = Array.prototype.indexOf.call(th.parentElement.children, th);
      var dir = th.dataset.dir === "asc" ? "desc" : "asc";
      ths.forEach(function (t) { delete t.dataset.dir; t.querySelector(".arrow") && t.querySelector(".arrow").remove(); });
      th.dataset.dir = dir;
      th.insertAdjacentHTML("beforeend", " <span class=\"arrow\">" + (dir === "asc" ? "\u25B2" : "\u25BC") + "</span>");
      var tbody = table.querySelector("tbody");
      var rows = Array.prototype.filter.call(tbody.querySelectorAll("tr"), function (r) { return !r.classList.contains("subrow"); });
      rows.sort(function (a, b) {
        var av = a.children[idx].dataset.v;
        var bv = b.children[idx].dataset.v;
        var an = parseFloat(av), bn = parseFloat(bv);
        var cmp;
        if (!isNaN(an) && !isNaN(bn)) cmp = an - bn;
        else cmp = String(av).localeCompare(String(bv));
        return dir === "asc" ? cmp : -cmp;
      });
      rows.forEach(function (r) {
        tbody.appendChild(r);
        var sub = tbody.querySelector("tr.subrow[data-parent=\"" + r.dataset.key + "\"]");
        if (sub) tbody.appendChild(sub);
      });
    });
  });
}

/* ---------- overview ---------- */
function renderOverview() {
  var el = document.getElementById("tab-overview");
  var warnings = OUT.warnings || [];
  var winning = OUT.winning_patterns || [];
  var html = "";

  html += "<div class=\"currency-note\">All monetary metrics use <strong>Indian Rupees (INR)</strong> with lakhs/crores grouping (e.g. &#8377;43,88,231.13). ROAS and performance index are unitless ratios, not currency.</div>";

  html += "<div class=\"cards\">";
  html += card("Ads checked", fmtInt(OUT.ads_checked));
  html += card("Scale candidates", fmtInt((OUT.ads_to_scale || []).length));
  html += card("Pause candidates", fmtInt((OUT.ads_to_pause || []).length));
  html += card("Ranked groups", fmtInt((OUT.ranked_groups || []).length));
  html += card("Crystal groups", fmtInt((OUT.crystal_groups || []).length));
  html += card("Cross patterns", fmtInt((OUT.cross_crystal_patterns || []).length));
  if (OUT.ranked_groups && OUT.ranked_groups.length) {
    var g0 = OUT.ranked_groups[0];
    html += card("Account avg ROAS", fmt(g0.account_avg_roas) + "x");
    html += card("Account avg CPA", fmtCost(g0.account_avg_cpa));
    html += card("Account avg CTR", fmtPct(g0.account_avg_ctr));
  }
  html += "</div>";

  if (warnings.length) {
    html += "<h2>Warnings</h2>";
    warnings.forEach(function (w) { html += "<div class=\"warn\">" + esc(w) + "</div>"; });
  }

  html += "<h2>Digest</h2><div class=\"digest\">" + esc(OUT.digest_text || OUT.digest || "No digest") + "</div>";

  if (winning.length) {
    html += "<h2>Winning Patterns</h2>";
    html += "<div class=\"tablewrap\"><table><thead><tr>" +
      "<th>Crystal</th><th>Value</th><th>Ads</th><th>Perf Index</th><th>Avg ROAS</th><th>Avg CPA (INR)</th><th>Avg CTR</th>" +
      "</tr></thead><tbody>";
    winning.forEach(function (p) {
      html += "<tr>" +
        "<td>" + esc(p.crystal_name) + "</td>" +
        "<td><span class=\"chip\">" + esc(p.crystal_value) + "</span></td>" +
        "<td>" + fmtInt(p.ad_count) + "</td>" +
        "<td class=\"good\">" + fmt(p.performance_index) + "</td>" +
        "<td>" + fmt(p.avg_roas) + "x</td>" +
        "<td>" + fmtCost(p.avg_cpa) + "</td>" +
        "<td>" + fmtPct(p.avg_ctr) + "</td>" +
        "</tr>";
    });
    html += "</tbody></table></div>";
    html += "<p class=\"hint\">Losing patterns and filtered groups are intentionally not shown in this view.</p>";
  }
  el.innerHTML = html;

  function card(k, v) {
    return "<div class=\"card\"><div class=\"k\">" + esc(k) + "</div><div class=\"v\">" + v + "</div></div>";
  }
}

/* ---------- scale / pause candidates ---------- */
function renderCandidates() {
  var el = document.getElementById("tab-candidates");
  var html = "";

  html += "<h2 style=\"color:var(--green)\">Ads to Scale (" + (OUT.ads_to_scale || []).length + ")</h2>";
  html += "<p class=\"hint\">Strong performance index with below-average spend share. Review the media, then consider scaling budget.</p>";
  html += candidateGrid(OUT.ads_to_scale || [], "scale");

  html += "<h2 style=\"color:var(--red); margin-top:34px\">Ads to Pause (" + (OUT.ads_to_pause || []).length + ")</h2>";
  html += "<p class=\"hint\">Underperform account averages on ROAS / CPA. Review the media, then consider pausing or reducing spend.</p>";
  html += candidateGrid(OUT.ads_to_pause || [], "pause");

  el.innerHTML = html;
}

function candidateGrid(list, kind) {
  if (!list.length) return "<p class=\"note\">None.</p>";
  var html = "<div class=\"candidates\">";
  list.forEach(function (a) {
    html += "<div class=\"cand " + kind + "\">";
    html += mediaBlock(a.ad_id);
    html += "<div class=\"body\">";
    html += "<span class=\"badge " + kind + "\">" + (kind === "scale" ? "Scale" : "Pause") + "</span>";
    html += "<div class=\"adid\">" + adLink(a.ad_id) + "</div>";
    html += "<div class=\"metricgrid\">" +
      m("ROAS", fmt(a.roas) + "x") +
      m("CPA (INR)", fmtCost(a.cpa)) +
      m("CTR", fmtPct(a.ctr)) +
      m("Spend (INR)", fmtMoney(a.spend)) +
      m("Impressions", fmtInt(a.impressions)) +
      "</div>";
    if (a.crystals_summary) {
      html += "<div>";
      String(a.crystals_summary).split("+").forEach(function (c) {
        html += "<span class=\"chip\">" + esc(c.trim()) + "</span>";
      });
      html += "</div>";
    }
    html += "<div class=\"reason\">" + esc(a.reason || "") + "</div>";
    html += "</div></div>";
  });
  html += "</div>";
  return html;

  function m(k, v) { return "<div class=\"m\"><div class=\"k\">" + k + "</div><div class=\"v\">" + v + "</div></div>"; }
}

/* ---------- performance table ---------- */
function renderPerformance() {
  var el = document.getElementById("tab-performance");
  var rows = OUT.performance || [];

  /* aggregate per ad */
  var byAd = {};
  rows.forEach(function (r) {
    var purchases = metricValue(r.purchases, r.conversions);
    var purchaseRevenue = metricValue(r.purchase_revenue, r.conversion_value);
    var a = byAd[r.ad_id] || (byAd[r.ad_id] = {
      ad_id: r.ad_id, impressions: 0, clicks: 0, spend: 0,
      conversions: 0, conversion_value: 0, reach: 0, weekly: []
    });
    a.impressions += r.impressions || 0;
    a.clicks += r.clicks || 0;
    a.spend += r.spend || 0;
    a.conversions += purchases;
    a.conversion_value += purchaseRevenue;
    a.reach += r.reach || 0;
    a.weekly.push(r);
  });
  var ads = Object.keys(byAd).map(function (k) {
    var a = byAd[k];
    a.ctr = a.impressions ? (a.clicks / a.impressions) * 100 : null;
    a.cpc = a.clicks ? a.spend / a.clicks : null;
    a.cpa = a.conversions ? a.spend / a.conversions : null;
    a.roas = a.spend ? a.conversion_value / a.spend : null;
    return a;
  });
  ads.sort(function (x, y) { return y.spend - x.spend; });

  var html = "<h2>Performance (aggregated per ad, " + rows.length + " weekly rows from Meta Insights)</h2>";
  html += "<div class=\"currency-note\">Spend, CPC, CPA, and conversion value are in <strong>INR (&#8377;)</strong> as reported by Meta for this account.</div>";
  html += "<div class=\"controls\"><input type=\"text\" id=\"perfFilter\" placeholder=\"Filter by ad id\u2026\" />" +
    "<span class=\"note\">Click an ad id to open its analysis card. Click \u25B8 to expand weekly breakdown. Click headers to sort.</span></div>";
  html += "<div class=\"tablewrap\"><table id=\"perfTable\"><thead><tr>" +
    "<th data-sort>Ad</th><th data-sort>Status</th><th data-sort>Impr.</th><th data-sort>Reach</th><th data-sort>Clicks</th>" +
    "<th data-sort>CTR</th><th data-sort>CPC (INR)</th><th data-sort>Spend (INR)</th><th data-sort>Conv.</th>" +
    "<th data-sort>CPA (INR)</th><th data-sort>Conv. Value (INR)</th><th data-sort>ROAS</th>" +
    "</tr></thead><tbody>";

  ads.forEach(function (a) {
    var flag = scaleIds[a.ad_id] ? " <span class=\"tag scale\">scale</span>" :
               pauseIds[a.ad_id] ? " <span class=\"tag pause\">pause</span>" : "";
    var entry = adIndex[a.ad_id];
    var status = entry && entry.ad ? entry.ad.status : "";
    html += "<tr data-key=\"" + esc(a.ad_id) + "\">" +
      cell("<span class=\"expander\" data-expand=\"" + esc(a.ad_id) + "\">\u25B8</span> " + adLink(a.ad_id) + flag, a.ad_id) +
      cell(esc(status), status) +
      cell(fmtInt(a.impressions), a.impressions) +
      cell(fmtInt(a.reach), a.reach) +
      cell(fmtInt(a.clicks), a.clicks) +
      cell(fmtPct(a.ctr), a.ctr) +
      cell(fmtCost(a.cpc), a.cpc) +
      cell(fmtMoney(a.spend), a.spend) +
      cell(fmtInt(a.conversions), a.conversions) +
      cell(fmtCost(a.cpa), a.cpa) +
      cell(fmtMoney(a.conversion_value), a.conversion_value) +
      classedCell(fmt(a.roas) + "x", a.roas, a.roas !== null && a.roas >= 133.2368 ? "good" : (a.roas !== null && a.roas > 0 ? "bad" : "")) +
      "</tr>";
    /* weekly subrow */
    var sub = "<table style=\"min-width:0;width:100%\"><thead><tr>" +
      "<th>Week start</th><th>Impr.</th><th>Clicks</th><th>CTR</th><th>CPC (INR)</th><th>Spend (INR)</th><th>Conv.</th><th>CPA (INR)</th><th>ROAS</th>" +
      "</tr></thead><tbody>";
    a.weekly.sort(function (x, y) { return String(x.date_start).localeCompare(String(y.date_start)); });
    a.weekly.forEach(function (w) {
      sub += "<tr>" +
        "<td>" + esc(w.date_start) + "</td>" +
        "<td>" + fmtInt(w.impressions) + "</td>" +
        "<td>" + fmtInt(w.clicks) + "</td>" +
        "<td>" + fmtPct(w.ctr) + "</td>" +
        "<td>" + fmtCost(w.cpc) + "</td>" +
        "<td>" + fmtMoney(w.spend) + "</td>" +
        "<td>" + fmtInt(metricValue(w.purchases, w.conversions)) + "</td>" +
        "<td>" + fmtCost(metricValue(w.cpa)) + "</td>" +
        "<td>" + fmt(metricValue(w.roas)) + "x</td>" +
        "</tr>";
    });
    sub += "</tbody></table>";
    html += "<tr class=\"subrow\" data-parent=\"" + esc(a.ad_id) + "\" style=\"display:none\">" +
      "<td colspan=\"12\">" + sub + "</td></tr>";
  });
  html += "</tbody></table></div>";
  el.innerHTML = html;

  makeSortable(document.getElementById("perfTable"));

  el.addEventListener("click", function (e) {
    var ex = e.target.closest("[data-expand]");
    if (!ex) return;
    var sub = el.querySelector("tr.subrow[data-parent=\"" + ex.dataset.expand + "\"]");
    if (!sub) return;
    var open = sub.style.display !== "none";
    sub.style.display = open ? "none" : "";
    ex.textContent = open ? "\u25B8" : "\u25BE";
  });

  document.getElementById("perfFilter").addEventListener("input", function () {
    var q = this.value.trim();
    el.querySelectorAll("#perfTable tbody tr:not(.subrow)").forEach(function (r) {
      var show = !q || r.dataset.key.indexOf(q) !== -1;
      r.style.display = show ? "" : "none";
      var sub = el.querySelector("tr.subrow[data-parent=\"" + r.dataset.key + "\"]");
      if (sub && !show) sub.style.display = "none";
    });
  });

  function cell(html, v) { return "<td data-v=\"" + esc(v === null || v === undefined ? "" : v) + "\">" + html + "</td>"; }
  function classedCell(html, v, cls) {
    return "<td class=\"" + cls + "\" data-v=\"" + esc(v === null || v === undefined ? "" : v) + "\">" + html + "</td>";
  }
}

/* ---------- ranked groups ---------- */
function renderRanked() {
  var el = document.getElementById("tab-ranked");
  var groups = OUT.ranked_groups || [];
  var html = "<h2>Ranked Crystal Groups (" + groups.length + ")</h2>" +
    "<p class=\"hint\">Filtered groups ranked by composite performance index vs account averages. Index &gt; 1.0 beats the account baseline. Click \u25B8 to see member ads.</p>";
  html += groupTable(groups, "rankedTable", true);
  el.innerHTML = html;
  makeSortable(document.getElementById("rankedTable"));
  wireGroupExpanders(el);
}

/* ---------- crystal groups ---------- */
function renderGroups() {
  var el = document.getElementById("tab-groups");
  var groups = OUT.crystal_groups || [];
  var html = "<h2>All Crystal Groups (" + groups.length + ")</h2>" +
    "<p class=\"hint\">Raw single-crystal buckets before confidence filtering and ranking. Click \u25B8 to see member ads.</p>";
  html += groupTable(groups, "groupsTable", false);
  el.innerHTML = html;
  makeSortable(document.getElementById("groupsTable"));
  wireGroupExpanders(el);
}

function groupTable(groups, id, ranked) {
  if (!groups.length) return "<p class=\"note\">None.</p>";
  var html = "<div class=\"tablewrap\"><table id=\"" + id + "\"><thead><tr>" +
    "<th data-sort>Crystal</th><th data-sort>Value</th><th data-sort>Ads</th>" +
    (ranked ? "<th data-sort>Perf Index</th>" : "") +
    "<th data-sort>Impr.</th><th data-sort>Spend (INR)</th><th data-sort>Avg CTR</th><th data-sort>Avg CPC (INR)</th>" +
    "<th data-sort>Avg CPA (INR)</th><th data-sort>Avg ROAS</th><th data-sort>Avg Conv. Rate</th>" +
    "</tr></thead><tbody>";
  groups.forEach(function (g, i) {
    var key = id + "-" + i;
    var idxCls = "";
    if (ranked && isNum(g.performance_index)) idxCls = g.performance_index >= 1 ? "good" : "bad";
    html += "<tr data-key=\"" + key + "\">" +
      "<td data-v=\"" + esc(g.crystal_name) + "\"><span class=\"expander\" data-gexpand=\"" + key + "\">\u25B8</span> " + esc(g.crystal_name) + "</td>" +
      "<td data-v=\"" + esc(g.crystal_value) + "\"><span class=\"chip\">" + esc(g.crystal_value) + "</span></td>" +
      "<td data-v=\"" + (g.count || 0) + "\">" + fmtInt(g.count) + "</td>" +
      (ranked ? "<td class=\"" + idxCls + "\" data-v=\"" + (g.performance_index === null || g.performance_index === undefined ? "" : g.performance_index) + "\">" + fmt(g.performance_index, 4) + "</td>" : "") +
      "<td data-v=\"" + (g.total_impressions || 0) + "\">" + fmtInt(g.total_impressions) + "</td>" +
      "<td data-v=\"" + (g.total_spend || 0) + "\">" + fmtMoney(g.total_spend) + "</td>" +
      "<td data-v=\"" + (g.avg_ctr === null || g.avg_ctr === undefined ? "" : g.avg_ctr) + "\">" + fmtPct(g.avg_ctr) + "</td>" +
      "<td data-v=\"" + (g.avg_cpc === null || g.avg_cpc === undefined ? "" : g.avg_cpc) + "\">" + fmtCost(g.avg_cpc) + "</td>" +
      "<td data-v=\"" + (g.avg_cpa === null || g.avg_cpa === undefined ? "" : g.avg_cpa) + "\">" + fmtCost(g.avg_cpa) + "</td>" +
      "<td data-v=\"" + (g.avg_roas === null || g.avg_roas === undefined ? "" : g.avg_roas) + "\">" + fmt(g.avg_roas) + "x</td>" +
      "<td data-v=\"" + dataMetricValue(g.avg_purchase_rate, g.avg_conversion_rate) + "\">" + fmt(metricValue(g.avg_purchase_rate, g.avg_conversion_rate)) + "</td>" +
      "</tr>";
    var links = (g.ad_ids || []).map(function (a) {
      var flag = scaleIds[a] ? " <span class=\"tag scale\">scale</span>" : pauseIds[a] ? " <span class=\"tag pause\">pause</span>" : "";
      return "<span style=\"margin-right:14px;display:inline-block\">" + adLink(a) + flag + "</span>";
    }).join("");
    html += "<tr class=\"subrow\" data-parent=\"" + key + "\" style=\"display:none\">" +
      "<td colspan=\"" + (ranked ? 11 : 10) + "\" style=\"white-space:normal\">" + links + "</td></tr>";
  });
  html += "</tbody></table></div>";
  return html;
}

function wireGroupExpanders(el) {
  el.addEventListener("click", function (e) {
    var ex = e.target.closest("[data-gexpand]");
    if (!ex) return;
    var sub = el.querySelector("tr.subrow[data-parent=\"" + ex.dataset.gexpand + "\"]");
    if (!sub) return;
    var open = sub.style.display !== "none";
    sub.style.display = open ? "none" : "";
    ex.textContent = open ? "\u25B8" : "\u25BE";
  });
}

/* ---------- cross crystal patterns ---------- */
function renderCross() {
  var el = document.getElementById("tab-cross");
  var pats = OUT.cross_crystal_patterns || [];
  var html = "<h2>Cross-Crystal Patterns (" + pats.length + ")</h2>" +
    "<p class=\"hint\">Crystal combinations that co-occur among the top-performing ads. Score is the average per-ad performance vs account baseline (1.0 = baseline).</p>";
  if (!pats.length) {
    html += "<p class=\"note\">None detected.</p>";
  } else {
    html += "<div class=\"xgrid\">";
    pats.forEach(function (p) {
      var s = p.avg_performance_score;
      var cls = isNum(s) ? (s >= 1 ? "good" : "bad") : "";
      html += "<div class=\"xcard\">";
      html += "<div class=\"score " + cls + "\">" + (isNum(s) ? fmt(s, 4) : "\u2014") + "</div>";
      html += "<div class=\"cnt\">" + fmtInt(p.ad_count) + " ads share this combination</div>";
      var combo = p.combination || {};
      Object.keys(combo).forEach(function (k) {
        html += "<div style=\"margin:3px 0\"><span class=\"chip k\">" + esc(k) + "</span> <span class=\"chip\">" + esc(combo[k]) + "</span></div>";
      });
      html += "</div>";
    });
    html += "</div>";
  }
  el.innerHTML = html;
}

/* ---------- analysis dataset ---------- */
function renderDataset() {
  var el = document.getElementById("tab-dataset");
  var ds = OUT.analysis_dataset || [];
  var html = "<h2>Analysis Dataset (" + ds.length + " ads)</h2>" +
    "<p class=\"hint\">Each card shows the actual ad media next to the crystals the LLM extracted, so you can verify the extraction is correct. Use the filter to find an ad.</p>";
  html += "<div class=\"controls\"><input type=\"text\" id=\"dsFilter\" placeholder=\"Filter by ad id or crystal value\u2026\" /></div>";
  html += "<div class=\"dsgrid\" id=\"dsGrid\">";

  var crystalOrder = ["visual", "environment", "mood", "mode", "talent", "hook", "offer", "colors", "audio", "music", "pace", "copy"];

  ds.forEach(function (entry) {
    var ad = entry.ad || {};
    var cr = entry.crystals || {};
    var perf = entry.performance || {};
    var flag = scaleIds[entry.ad_id] ? "<span class=\"tag scale\">scale candidate</span>" :
               pauseIds[entry.ad_id] ? "<span class=\"tag pause\">pause candidate</span>" : "";
    var searchable = (entry.ad_id + " " + JSON.stringify(cr)).toLowerCase();

    html += "<div class=\"ds\" id=\"ad-" + esc(entry.ad_id) + "\" data-search=\"" + esc(searchable) + "\">";
    html += mediaBlock(entry.ad_id);
    html += "<div class=\"body\">";
    html += "<div class=\"head\"><span class=\"adid\">" + esc(entry.ad_id) + "</span>" +
      "<span><span class=\"tag\">" + esc(ad.asset_type || "?") + "</span> " +
      "<span class=\"tag\">" + esc(ad.status || "?") + "</span> " + flag + "</span></div>";
    html += "<div class=\"note mono\" style=\"margin:4px 0 2px\">campaign " + esc(ad.campaign_id || "\u2014") +
      (isNum(ad.duration_seconds) ? " &middot; " + fmt(ad.duration_seconds, 1) + "s" : "") + "</div>";

    html += "<div class=\"crystals\">";
    crystalOrder.forEach(function (k) {
      if (!(k in cr) || k === "transcript") return;
      var v = cr[k];
      if (Array.isArray(v)) v = v.join(", ");
      if (v === "" || v === null || v === undefined) v = "\u2014";
      html += "<div class=\"c\"><div class=\"k\">" + esc(k) + "</div><div class=\"v\">" + esc(v) + "</div></div>";
    });
    html += "</div>";

    if (cr.transcript) {
      html += "<details class=\"tr\"><summary>Transcript</summary><p>" + esc(cr.transcript) + "</p></details>";
    }

    html += "<div class=\"perfline\">" +
      pm("Impressions", fmtInt(perf.impressions)) +
      pm("Clicks", fmtInt(perf.clicks)) +
      pm("CTR", fmtPct(perf.ctr)) +
      pm("Spend (INR)", fmtMoney(perf.spend)) +
      pm("Conv.", fmtInt(perf.conversions)) +
      pm("CPA (INR)", fmtCost(perf.cpa)) +
      pm("ROAS", fmt(perf.roas) + "x") +
      "</div>";
    html += "<div class=\"note\" style=\"margin-top:6px\">Performance row date: " + esc(perf.date_start || "\u2014") +
      " (latest joined insight row; see Performance tab for full weekly history)</div>";
    html += "</div></div>";
  });
  html += "</div>";
  el.innerHTML = html;

  document.getElementById("dsFilter").addEventListener("input", function () {
    var q = this.value.trim().toLowerCase();
    document.querySelectorAll("#dsGrid .ds").forEach(function (c) {
      c.style.display = !q || c.dataset.search.indexOf(q) !== -1 ? "" : "none";
    });
  });

  function pm(k, v) { return "<div class=\"m\"><div class=\"k\">" + k + "</div><div class=\"v\">" + v + "</div></div>"; }
}
</script>
</body>
</html>
